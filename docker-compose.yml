services:
  backend:
    build: ./backend
    container_name: chatbot_backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: always

  frontend:
    build: ./frontend
    container_name: chatbot_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always
