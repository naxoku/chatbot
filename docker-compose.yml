services:
  backend:
    build: ./backend
    container_name: chatbot_backend
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_ENVIRONMENT=docker
        - VITE_BACKEND_PORT=3000
    container_name: chatbot_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always
